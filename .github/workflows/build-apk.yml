name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Sync Web Application Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css script.js manifest.json privacy.html icon-192.png icon-512.png app-icon.png android/app/src/main/assets/

      - name: Build Android APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/UniversalCSCalculator.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCSCalculator-APK
          path: output/UniversalCSCalculator.apk
          if-no-files-found: error
          retention-days: 90
